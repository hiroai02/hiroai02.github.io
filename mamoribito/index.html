<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legend防衛</title>
<style>
html,body{margin:0;min-height:100%;background:#ecddb0;color:#3a2e1e;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
#boot b{display:block;font-size:20px;margin-bottom:8px}
#boot small{opacity:.7}
</style>
</head>
<body>
<div id="boot"><div><b>Legend防衛</b><small>読み込み中…</small></div></div>
<script>
(async()=>{
  const base='./live_chunks/20260922-live-v9-clean/';
  const files=["part-00.txt","part-01.txt","part-02.txt","part-03.txt","part-04.txt","part-05.txt","part-06.txt","part-07.txt","part-17.txt","part-18.txt"];
  try{
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(base+f+'?v=20260922-live-v11-coherent',{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      return r.text();
    }));
    const html=parts.join('');
    // Do not hard-stop the game on a temporary GitHub Pages/CDN revision skew.
    // Cache-busting already requests the newest chunks; if all parts loaded successfully,
    // render them even if the embedded revision marker is still propagating.
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').innerHTML='<div><b>読み込みエラー</b><small>'+String(err)+'</small></div>';
    console.error(err);
  }
})();
</script>
</body>
</html>
