<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ナンプレ"><title>高難易度ナンプレ</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#203247;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,select{font:inherit;touch-action:manipulation}main{max-width:550px;margin:auto;padding:8px 10px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{margin:0;font-size:20px}select{font-size:12px;padding:8px;border:1px solid #c9d4e0;border-radius:8px;background:white;max-width:48%}#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:2px solid #364a5a;flex-shrink:0}#board button{padding:0;min-width:0;min-height:0;border:0;border-right:1px solid #c5cdd4;border-bottom:1px solid #c5cdd4;border-radius:0;background:#fff;color:#146aa4;font-weight:700;font-size:clamp(18px,5.3vw,29px);display:grid;place-items:center;position:relative;-webkit-tap-highlight-color:transparent}#board button.given{color:#1b2835;font-weight:800}#board button.peer{background:#cbd2da!important}#board button.same{background:#bedffa!important;color:#00558d}#board button.sel{background:#2a7ac0!important;color:white!important;box-shadow:inset 0 0 0 2px #07548c;z-index:2}#board button.c3{border-right:3px solid #35485b}#board button.r3{border-bottom:3px solid #35485b}#board .notes{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;font-size:clamp(8px,2.2vw,12px);font-weight:400;color:#8195a8}#board .sel .notes{color:white}#board .notes .matching-note{color:#0757a7;font-weight:900;font-size:1.2em}#board .sel .notes .matching-note{color:white;text-decoration:underline}.modes{display:grid;grid-template-columns:1fr 1fr 75px 65px;gap:5px}.modes button,.actions button{border:1px solid #c0cfdb;border-radius:9px;padding:10px 2px;background:#f3f6f9;color:#315069;font-size:13px;font-weight:700}.modes button.active{background:#2877be;color:white;border-color:#2877be}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#nums{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px}#nums button{height:48px;border:1px solid #bfd5e8;background:#eaf5ff;color:#16649d;border-radius:8px;font-size:24px;font-weight:800;padding:0}#nums button:disabled{background:#eee;color:#aaa}#status{display:none!important}dialog{border:1px solid #cbd5e1;border-radius:14px;max-width:92vw;width:440px;max-height:78dvh;overflow:auto;padding:20px;background:white;color:#22354a}dialog::backdrop{background:#132b447d}dialog p{white-space:pre-line;line-height:1.65}dialog button{padding:10px 15px;border:0;background:#2877be;color:white;border-radius:8px}dialog .close{float:right}@media(max-height:740px){main{gap:5px;padding-top:4px}#board{width:min(100%,calc(100dvh - 224px));margin:auto}#nums button{height:40px}.modes button,.actions button{padding:7px 2px}h1{font-size:17px}}@media(max-width:350px){.modes{grid-template-columns:1fr 1fr 59px 55px}.modes button{font-size:11px}}
</style></head><body><main><header><h1>高難易度ナンプレ</h1><select id="level"><option value="medium">標準</option><option value="easy">やさしめ</option><option value="everest">Everest・超難問</option><option value="escargot">AI Escargot・超難問</option></select></header><div id="board" aria-label="9×9のナンプレ盤面"></div><div class="modes"><button id="input" class="active">数字入力</button><button id="memo">薄字メモ</button><button id="erase">消去</button><button id="undo">戻す</button></div><div class="actions"><button id="automatic">自動メモ</button><button id="hint">ヒント</button><button id="reset">最初から</button></div><div id="nums"></div><div id="status" aria-live="off" hidden></div></main><dialog id="dialog"><h2 id="dt"></h2><p id="dd"></p><button class="close" id="dc">閉じる</button></dialog><script>
(function(){'use strict';const puzzles={easy:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',medium:'000260701680070090190004500820100040004602900050003028009300074040050036703018000',everest:'800000000003600000070090200050007000000045700000100030001000068008500010090000400',escargot:'100007090030020008009600500005300900010080002600004000300000010040000007007000300'};const solutions={easy:'534678912672195348198342567859761423426853791713924856961537284287419635345286179',medium:'435269781682571493197834562826195347374682915951743628519326874248957136763418259',everest:'812753649943682175675491283154237896369845721287169534521974368438526917796318452',escargot:'162857493534129678789643521475312986913586742628794135356478219241935867897261354'};const $=s=>document.getElementById(s),board=$('board');let game='medium',given=[],answer=[],vals=[],notes=[],selected=-1,focusDigit=0,mode='input',hist=[],done=false;const row=i=>i/9|0,col=i=>i%9,box=i=>(row(i)/3|0)*3+(col(i)/3|0);function related(a,b){return row(a)===row(b)||col(a)===col(b)||box(a)===box(b)}function candidates(i){if(vals[i])return[];let used=new Set();for(let j=0;j<81;j++)if(related(i,j)&&vals[j])used.add(vals[j]);return [1,2,3,4,5,6,7,8,9].filter(v=>!used.has(v))}function say(s){$('status').textContent=s}function save(){try{localStorage.setItem('hiro-sudoku-'+game,JSON.stringify({vals,notes}))}catch(e){}}function snap(){hist.push({vals:vals.slice(),notes:notes.map(x=>x.slice())});if(hist.length>80)hist.shift()}function modal(t,s){$('dt').textContent=t;$('dd').textContent=s;const d=$('dialog');if(d.showModal)d.showModal();else alert(t+'\n'+s)}function draw(){const f=document.createDocumentFragment();for(let i=0;i<81;i++){let b=document.createElement('button');b.type='button';let v=vals[i];let chosen=focusDigit||(selected>=0?vals[selected]:0);let matching=chosen?vals.map((x,j)=>x===chosen?j:-1).filter(j=>j>=0):selected>=0?[selected]:[];let peer=i!==selected&&matching.some(j=>row(i)===row(j)||col(i)===col(j)||box(i)===box(j));let same=chosen!==0&&v===chosen;b.className=(given[i]?'given ':'')+(peer?'peer ':'')+(same?'same ':'')+(selected===i?'sel ':'')+(row(i)%3===2&&row(i)!==8?'r3 ':'')+(col(i)%3===2&&col(i)!==8?'c3 ':'');b.setAttribute('aria-label',(row(i)+1)+'行'+(col(i)+1)+'列 '+(v||'空欄'));if(v)b.textContent=String(v);else{let d=document.createElement('div');d.className='notes';for(let n=1;n<=9;n++){let span=document.createElement('span');span.textContent=notes[i].includes(n)?n:'';if(chosen&&n===chosen&&notes[i].includes(n))span.className='matching-note';d.append(span)}b.append(d)}b.addEventListener('click',()=>{selected=i;focusDigit=vals[i]||0;draw();say((row(i)+1)+'行'+(col(i)+1)+'列を選択')});f.append(b)}board.replaceChildren(f);$('input').classList.toggle('active',mode==='input');$('memo').classList.toggle('active',mode==='memo');for(let b of $('nums').children)b.disabled=done}function check(){if(vals.every((n,i)=>n===answer[i])){done=true;draw();modal('クリア！','全81マス正解です。おめでとうございます。');say('クリアしました')}else if(vals.every(Boolean))say('まだ正解ではないマスがあります。数字を見直してください')}function clearNote(n,i){for(let j=0;j<81;j++)if(related(i,j))notes[j]=notes[j].filter(x=>x!==n)}function put(n){if(done)return;focusDigit=n||0;if(selected<0){draw();say('数字 '+n+' の行・列を灰色表示中。入力するマスを選んでください');return}if(given[selected]){draw();say('最初からある数字は変更できません');return}snap();if(mode==='memo'&&n){if(vals[selected])vals[selected]=0;let a=notes[selected],p=a.indexOf(n);if(p>=0)a.splice(p,1);else if(candidates(selected).includes(n))a.push(n);else say('この数字は候補に入りません')}else{vals[selected]=n;notes[selected]=[];if(n)clearNote(n,selected)}draw();save();check()}function start(k){game=k;given=puzzles[k].split('').map(Number);answer=solutions[k].split('').map(Number);vals=given.slice();notes=Array.from({length:81},()=>[]);selected=-1;focusDigit=0;mode='input';hist=[];done=false;try{let o=JSON.parse(localStorage.getItem('hiro-sudoku-'+k));if(o&&Array.isArray(o.vals)&&o.vals.length===81&&o.vals.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=9&&(!given[i]||v===given[i]))){vals=o.vals;if(Array.isArray(o.notes)&&o.notes.length===81)notes=o.notes.map(a=>Array.isArray(a)?a.filter(n=>Number.isInteger(n)&&n>0&&n<=9):[])}}catch(e){}done=vals.every((n,i)=>n===answer[i]);draw();say('マスを選んで数字を入力')}for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>put(n));$('nums').append(b)}$('input').onclick=()=>{mode='input';draw();say('数字入力モード')};$('memo').onclick=()=>{mode='memo';draw();say('薄字メモモード')};$('erase').onclick=()=>put(0);$('undo').onclick=()=>{if(!hist.length){say('戻す操作はありません');return}let h=hist.pop();vals=h.vals;notes=h.notes;done=false;draw();save();say('1手戻しました')};$('automatic').onclick=()=>{if(done)return;snap();for(let i=0;i<81;i++)if(!vals[i])notes[i]=candidates(i);draw();save();say('空きマスに候補を自動入力しました')};$('hint').onclick=()=>{let i=-1,n=0,why='';for(let x=0;x<81;x++){if(!vals[x]){let c=candidates(x);if(c.length===1){i=x;n=c[0];why='同じ行・列・3×3の枠にある数字を除くと、このマスの候補は '+n+' だけです。';break}}}if(i<0){outer:for(let type=0;type<3;type++)for(let u=0;u<9;u++)for(let v=1;v<=9;v++){let a=[];for(let x=0;x<81;x++)if(!vals[x]&&(type===0?row(x)===u:type===1?col(x)===u:box(x)===u)&&candidates(x).includes(v))a.push(x);if(a.length===1){i=a[0];n=v;why=(type===0?'同じ行':type===1?'同じ列':'同じ3×3の枠')+'で数字 '+v+' が入る候補の場所はここだけです。';break outer}}}if(i<0){let open=vals.findIndex(v=>v===0);if(open<0){modal('ヒント','すべて埋まっています');return}i=open;n=answer[i];why='基本的な2種類の論理では確定できません。唯一解の数字を参考として表示します（論理解説ではありません）。'}selected=i;draw();modal('ヒント：'+(row(i)+1)+'行'+(col(i)+1)+'列','数字 '+n+'。\n'+why)};$('reset').onclick=()=>{if(confirm('この問題を最初からやり直しますか？')){try{localStorage.removeItem('hiro-sudoku-'+game)}catch(e){}start(game)}};$('level').onchange=e=>start(e.target.value);$('dc').onclick=()=>$('dialog').close();try{start(game)}catch(e){say('起動エラー: '+e.message)}})();
</script></body></html>
