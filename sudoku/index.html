*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#203247;font-family:-apple-system,BlinkMacSystemFont,sans-serif}button,select{font:inherit;touch-action:manipulation}main{max-width:550px;margin:auto;padding:8px 10px max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:9px;min-height:100dvh}header{display:flex;justify-content:space-between;align-items:center;gap:8px}h1{margin:0;font-size:20px}select{font-size:12px;padding:8px;border:1px solid #c9d4e0;border-radius:8px;background:white;max-width:48%}#board{width:100%;aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);border:2px solid #364a5a;flex-shrink:0}#board button{padding:0;min-width:0;min-height:0;border:0;border-right:1px solid #c5cdd4;border-bottom:1px solid #c5cdd4;border-radius:0;background:#fff;color:#146aa4;font-weight:700;font-size:clamp(18px,5.3vw,29px);display:grid;place-items:center;position:relative;-webkit-tap-highlight-color:transparent}#board button.given{color:#1b2835;font-weight:800}#board button.peer{background:#cbd2da!important}#board button.same{background:#bedffa!important;color:#00558d}#board button.sel{background:#2a7ac0!important;color:white!important;box-shadow:inset 0 0 0 2px #07548c;z-index:2}#board button.c3{border-right:3px solid #35485b}#board button.r3{border-bottom:3px solid #35485b}#board .notes{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);align-items:center;justify-items:center;font-size:clamp(8px,2.2vw,12px);font-weight:400;color:#8195a8}#board .sel .notes{color:white}#board .notes .matching-note{color:#0757a7;font-weight:900;font-size:1.2em}#board .sel .notes .matching-note{color:white;text-decoration:underline}.modes{display:grid;grid-template-columns:1fr 1fr 75px 65px;gap:5px}.modes button,.actions button{border:1px solid #c0cfdb;border-radius:9px;padding:10px 2px;background:#f3f6f9;color:#315069;font-size:13px;font-weight:700}.mode header .topactions{display:flex;gap:6px}header .topactions button{border:1px solid #b9cbdc;background:#f1f6fb;border-radius:8px;padding:8px 7px;font-size:12px;font-weight:700;color:#245d90;white-space:nowrap}header #reset{background:#fff;color:#7b6472;border-color:#ded6db}#library{position:fixed;inset:0;background:#fff;z-index:30;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}#library[hidden]{display:none!important}.libraryhead{max-width:540px;margin:0 auto 22px;display:flex;align-items:center;justify-content:space-between;gap:8px}.libraryhead h2{font-size:20px;margin:0}.libraryhead button{border:1px solid #c3d1dc;border-radius:9px;padding:10px;background:#f5f8fb;color:#245478;font-weight:700}#libraryContent{max-width:540px;margin:auto;display:grid;gap:10px}.listcard{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;padding:16px;border-radius:12px;border:1px solid #cbd8e5;background:#f7fbff;color:#213a50;font-size:16px;font-weight:700}.listcard small{display:block;font-size:12px;font-weight:400;color:#697b8d;margin-top:4px}.liststate{font-size:12px;font-weight:700;color:#286cad;white-space:nowrap;margin-left:8px}.liststate.complete{color:#24754b}@media(max-width:380px){header h1{font-size:16px}header .topactions button{padding:7px 5px;font-size:11px}}.continuousrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%;flex:none}.continuousrow button{width:100%;min-width:0;min-height:45px;display:block;font-size:14px;padding:9px 4px}.continuousrow button{border:1px solid #a8c6e0;background:#edf6ff;color:#145c96;font-weight:750;border-radius:9px;padding:9px 12px;white-space:nowrap;font-size:13px}.continuousrow button.active{background:#2877be;color:#fff}.continuousrow span{font-size:11px;color:#677c8e}#nums button.digit-picked:not(:disabled){background:#2779bd;color:white;border-color:#155a95;box-shadow:inset 0 0 0 2px #174f80}#continuous:disabled{opacity:.5}</style></head><body><main><header><h1 id="gameTitle">ナンプレ No.02</h1><div class="topactions"><button id="reset" type="button">最初から</button><button id="browse" type="button">問題一覧</button></div></header><div id="board" aria-label="9×9のナンプレ盤面"></div><div class="continuousrow"><button id="continuous" type="button" aria-pressed="false">連続入力：OFF</button><button id="continuousMemo" type="button" aria-pressed="false">連続メモ：OFF</button></div><div class="modes"><button id="input" class="active">数字入力</button><button id="memo">薄字メモ</button><button id="erase">消去</button><button id="undo">戻す</button></div><div class="actions"><button id="automatic">自動メモ</button><button id="hint">ヒント</button><button id="returnList">問題を選ぶ</button></div><div id="nums"></div><div id="status" aria-live="off" hidden></div></main><section id="library" hidden><div class="libraryhead"><button id="libraryBack" type="button">戻る</button><h2 id="libraryTitle">問題一覧</h2><button id="libraryClose" type="button">閉じる</button></div><div id="libraryContent"></div></section><dialog id="dialog"><h2 id="dt"></h2><p id="dd"></p><button class="close" id="dc">閉じる</button></dialog><script>
(function(){'use strict';const puzzles={easy:'530070000600195000098000060800060003400803001700020006060000280000419005000080079',medium:'000260701680070090190004500820100040004602900050003028009300074040050036703018000',everest:'800000000003600000070090200050007000000045700000100030001000068008500010090000400',escargot:'100007090030020008009600500005300900010080002600004000300000010040000007007000300'};const solutions={easy:'534678912672195348198342567859761423426853791713924856961537284287419635345286179',medium:'435269781682571493197834562826195347374682915951743628519326874248957136763418259',everest:'812753649943682175675491283154237896369845721287169534521974368438526917796318452',escargot:'162857493534129678789643521475312986913586742628794135356478219241935867897261354'};const $=s=>document.getElementById(s),board=$('board');const catalog=[{key:'easy',no:'01',level:'やさしめ'},{key:'medium',no:'02',level:'標準'},{key:'everest',no:'03',level:'超難問'},{key:'escargot',no:'04',level:'超難問'}];let libraryLevel=null;let game='medium',given=[],answer=[],vals=[],notes=[],selected=-1,focusDigit=0,mode='input',hist=[],done=false,continuous=false,continuousMemo=false,continuousDigit=0;const row=i=>i/9|0,col=i=>i%9,box=i=>(row(i)/3|0)*3+(col(i)/3|0);function related(a,b){return row(a)===row(b)||col(a)===col(b)||box(a)===box(b)}function candidates(i){if(vals[i])return[];let used=new Set();for(let j=0;j<81;j++)if(related(i,j)&&vals[j])used.add(vals[j]);return [1,2,3,4,5,6,7,8,9].filter(v=>!used.has(v))}function say(s){$('status').textContent=s}function save(){try{localStorage.setItem('hiro-sudoku-'+game,JSON.stringify({vals,notes}))}catch(e){}}function completed(k){try{return localStorage.getItem('hiro-sudoku-complete-'+k)==='1'}catch(e){return false}}function progress(k){try{let o=JSON.parse(localStorage.getItem('hiro-sudoku-'+k)||'null');return !!(o&&Array.isArray(o.vals)&&o.vals.some((v,i)=>v&&!Number(puzzles[k][i])))}catch(e){return false}}function openLibrary(level=null){libraryLevel=level;renderLibrary();$('library').hidden=false}function renderLibrary(){const root=$('libraryContent');root.replaceChildren();$('libraryTitle').textContent=libraryLevel||'問題一覧';$('libraryBack').hidden=!libraryLevel;$('libraryClose').textContent='閉じる';if(!libraryLevel){for(const name of ['やさしめ','標準','超難問']){const count=catalog.filter(x=>x.level===name).length;let b=document.createElement('button');b.className='listcard';b.textContent=name+'（'+count+'問）';b.onclick=()=>{libraryLevel=name;renderLibrary()};root.append(b)}return}for(const x of catalog.filter(x=>x.level===libraryLevel)){let b=document.createElement('button');b.className='listcard';let label=document.createElement('span');label.textContent='ナンプレ No.'+x.no;let more=document.createElement('small');more.textContent=x.key==='everest'?'Everest':x.key==='escargot'?'AI Escargot':x.level;label.append(more);let state=document.createElement('span');state.className='liststate'+(completed(x.key)?' complete':'');state.textContent=completed(x.key)?'完了':progress(x.key)?'途中保存':'未着手';b.append(label,state);b.onclick=()=>{start(x.key);$('library').hidden=true};root.append(b)}}function snap(){hist.push({vals:vals.slice(),notes:notes.map(x=>x.slice())});if(hist.length>80)hist.shift()}function modal(t,s){$('dt').textContent=t;$('dd').textContent=s;const d=$('dialog');if(d.showModal)d.showModal();else alert(t+'\n'+s)}function draw(){const f=document.createDocumentFragment();for(let i=0;i<81;i++){let b=document.createElement('button');b.type='button';let v=vals[i];let chosen=focusDigit||(selected>=0?vals[selected]:0);let matching=chosen?vals.map((x,j)=>x===chosen?j:-1).filter(j=>j>=0):selected>=0?[selected]:[];let peer=i!==selected&&matching.some(j=>row(i)===row(j)||col(i)===col(j)||box(i)===box(j));let same=chosen!==0&&v===chosen;b.className=(given[i]?'given ':'')+(peer?'peer ':'')+(same?'same ':'')+(selected===i?'sel ':'')+(row(i)%3===2&&row(i)!==8?'r3 ':'')+(col(i)%3===2&&col(i)!==8?'c3 ':'');b.setAttribute('aria-label',(row(i)+1)+'行'+(col(i)+1)+'列 '+(v||'空欄'));if(v)b.textContent=String(v);else{let d=document.createElement('div');d.className='notes';for(let n=1;n<=9;n++){let span=document.createElement('span');span.textContent=notes[i].includes(n)?n:'';if(chosen&&n===chosen&&notes[i].includes(n))span.className='matching-note';d.append(span)}b.append(d)}b.addEventListener('click',()=>{selected=i;if((continuous||continuousMemo)&&continuousDigit&&!done&&!given[i]){mode=continuousMemo?'memo':'input';put(continuousDigit);return}focusDigit=vals[i]||0;draw();say((row(i)+1)+'行'+(col(i)+1)+'列を選択')});f.append(b)}board.replaceChildren(f);$('input').classList.toggle('active',mode==='input');$('memo').classList.toggle('active',mode==='memo');for(let n=1;n<=9;n++){const button=$('nums').children[n-1];const count=vals.filter(v=>v===n).length;button.disabled=done||count>=9;button.classList.toggle('digit-complete',count>=9);button.classList.toggle('digit-picked',(continuous||continuousMemo)&&continuousDigit===n);button.setAttribute('aria-label',n+'：'+(count>=9?'9個配置済み':count+'個配置済み'));button.title=count>=9?'9個配置済み':count+'/9'}for(let id of ['input','memo','erase','undo','automatic','hint','returnList','continuous','continuousMemo'])$(id).disabled=done;$('continuous').classList.toggle('active',continuous);$('continuousMemo').classList.toggle('active',continuousMemo);$('continuousMemo').textContent='連続メモ：'+(continuousMemo?'ON':'OFF');$('continuousMemo').setAttribute('aria-pressed',String(continuousMemo));$('continuous').textContent='連続入力：'+(continuous?'ON':'OFF');$('continuous').setAttribute('aria-pressed',String(continuous));$('continuousInfo').textContent=(continuous||continuousMemo)?(continuousDigit?'選択：'+continuousDigit:'下の数字を選択'):''}function check(){if(vals.every((n,i)=>n===answer[i])){done=true;try{localStorage.setItem('hiro-sudoku-complete-'+game,'1')}catch(e){}draw();modal('クリア！','全81マス正解です。おめでとうございます。');say('クリアしました')}else if(vals.every(Boolean))say('まだ正解ではないマスがあります。数字を見直してください')}function clearNote(n,i){for(let j=0;j<81;j++)if(related(i,j))notes[j]=notes[j].filter(x=>x!==n)}function put(n){if(done)return;focusDigit=n||0;if(selected<0){draw();say('数字 '+n+' の行・列を灰色表示中。入力するマスを選んでください');return}if(given[selected]){draw();say('最初からある数字は変更できません');return}snap();if(mode==='memo'&&n){if(vals[selected])vals[selected]=0;let a=notes[selected],p=a.indexOf(n);if(p>=0)a.splice(p,1);else if(candidates(selected).includes(n))a.push(n);else say('この数字は候補に入りません')}else{vals[selected]=n;notes[selected]=[];if(n)clearNote(n,selected)}draw();save();check()}function start(k){game=k;given=puzzles[k].split('').map(Number);answer=solutions[k].split('').map(Number);vals=given.slice();notes=Array.from({length:81},()=>[]);selected=-1;focusDigit=0;mode='input';hist=[];done=false;continuous=false;continuousMemo=false;continuousDigit=0;try{let o=JSON.parse(localStorage.getItem('hiro-sudoku-'+k));if(o&&Array.isArray(o.vals)&&o.vals.length===81&&o.vals.every((v,i)=>Number.isInteger(v)&&v>=0&&v<=9&&(!given[i]||v===given[i]))){vals=o.vals;if(Array.isArray(o.notes)&&o.notes.length===81)notes=o.notes.map(a=>Array.isArray(a)?a.filter(n=>Number.isInteger(n)&&n>0&&n<=9):[])}}catch(e){}done=vals.every((n,i)=>n===answer[i]);$('gameTitle').textContent='ナンプレ No.'+(catalog.find(x=>x.key===k)||catalog[1]).no;draw();say('マスを選んで数字を入力')}for(let n=1;n<=9;n++){let b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>{if(continuous||continuousMemo){continuousDigit=n;focusDigit=n;draw()}else put(n)});$('nums').append(b)}$('continuous').onclick=()=>{continuous=!continuous;continuousMemo=false;continuousDigit=0;if(continuous)mode='input';draw()};$('continuousMemo').onclick=()=>{continuousMemo=!continuousMemo;continuous=false;continuousDigit=0;if(continuousMemo)mode='memo';draw()};$('input').onclick=()=>{mode='input';continuous=false;continuousMemo=false;continuousDigit=0;draw();say('数字入力モード')};$('memo').onclick=()=>{mode='memo';continuous=false;continuousMemo=false;continuousDigit=0;draw();say('薄字メモモード')};$('erase').onclick=()=>put(0);$('undo').onclick=()=>{if(!hist.length){say('戻す操作はありません');return}let h=hist.pop();vals=h.vals;notes=h.notes;done=false;draw();save();say('1手戻しました')};$('automatic').onclick=()=>{if(done)return;snap();for(let i=0;i<81;i++)if(!vals[i])notes[i]=candidates(i);draw();save();say('空きマスに候補を自動入力しました')};$('hint').onclick=()=>{let i=-1,n=0,why='';for(let x=0;x<81;x++){if(!vals[x]){let c=candidates(x);if(c.length===1){i=x;n=c[0];why='同じ行・列・3×3の枠にある数字を除くと、このマスの候補は '+n+' だけです。';break}}}if(i<0){outer:for(let type=0;type<3;type++)for(let u=0;u<9;u++)for(let v=1;v<=9;v++){let a=[];for(let x=0;x<81;x++)if(!vals[x]&&(type===0?row(x)===u:type===1?col(x)===u:box(x)===u)&&candidates(x).includes(v))a.push(x);if(a.length===1){i=a[0];n=v;why=(type===0?'同じ行':type===1?'同じ列':'同じ3×3の枠')+'で数字 '+v+' が入る候補の場所はここだけです。';break outer}}}if(i<0){let open=vals.findIndex(v=>v===0);if(open<0){modal('ヒント','すべて埋まっています');return}i=open;n=answer[i];why='基本的な2種類の論理では確定できません。唯一解の数字を参考として表示します（論理解説ではありません）。'}selected=i;draw();modal('ヒント：'+(row(i)+1)+'行'+(col(i)+1)+'列','数字 '+n+'。\n'+why)};$('reset').onclick=()=>{if(confirm('この問題を最初からやり直しますか？')){try{localStorage.removeItem('hiro-sudoku-'+game)}catch(e){}start(game)}};$('browse').onclick=()=>openLibrary();$('returnList').onclick=()=>openLibrary();$('libraryBack').onclick=()=>{libraryLevel=null;renderLibrary()};$('libraryClose').onclick=()=>{$('library').hidden=true};$('dc').onclick=()=>$('dialog').close();try{start(game)}catch(e){say('起動エラー: '+e.message)}})();
