<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#167d79"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="病児保育の持ち物"><title>病児保育 持ち物チェック</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f8f7;color:#21383a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:100px}header{background:linear-gradient(140deg,#155a66,#138d7a);color:white;padding:calc(24px + env(safe-area-inset-top)) 18px 25px;border-radius:0 0 25px 25px}header>div,main,footer>div{max-width:600px;margin:auto}h1{font-size:24px;margin:8px 0}header p{font-size:13px;line-height:1.5}.stats{display:flex;justify-content:space-between;align-items:end;margin:15px 0 9px}.stats strong{font-size:27px}.track{height:11px;background:#ffffff55;border-radius:20px;overflow:hidden}.bar{height:100%;background:#aff3c9;width:0;transition:width .2s}main{padding:17px 13px}section{margin-bottom:20px}h2{font-size:16px;color:#285d62;margin:0 5px 10px}.item{display:flex;align-items:center;gap:12px;min-height:60px;padding:13px 12px;background:white;border:1px solid #dcebea;border-radius:14px;margin:8px 0;font-size:16px;font-weight:600;line-height:1.5}.item input{width:25px;height:25px;flex:0 0 25px;accent-color:#17867a}.item:has(input:checked){background:#e7f7ec;border-color:#a6d6b3}.item:has(input:checked) span{text-decoration:line-through;color:#7b918a}.note{background:#fff2cc;padding:15px;border-radius:14px;font-size:14px;line-height:1.7;margin-bottom:20px}.extra{display:flex;gap:8px}.extra input{min-width:0;flex:1;border:1px solid #bdd2d0;border-radius:12px;padding:13px;font-size:16px}.extra button{background:#117b75;color:white;border:0;border-radius:12px;padding:0 16px;font-size:15px;font-weight:bold}.remove{border:0;background:none;color:#a44747;margin-left:auto;font-size:22px;min-width:35px}.hint{font-size:12px;line-height:1.7;color:#687b7c}footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #d6e6e2;backdrop-filter:blur(12px)}footer>div{display:flex;gap:10px}footer button{flex:1;padding:15px 7px;border:0;border-radius:12px;background:#176d73;color:white;font-size:15px;font-weight:bold}footer button:first-child{background:#e1eded;color:#215a5d}</style></head><body><header><div><small>病児保育の準備</small><h1>🧸 持ち物チェックリスト</h1><p>用意できたものをタップ。チェックはこのiPhoneに保存され、次回も使えます。</p><div class="stats"><span>準備できたもの</span><strong id="count">0 / 18</strong></div><div class="track"><div class="bar" id="bar"></div></div><p id="status">読み込み中</p></div></header><main><div id="checklist"></div><div class="note"><b>📌 すべての持ち物に名前を書いてください。</b><div>※ オムツ・おしり拭きにも記名をお願いします。</div></div><section><h2>➕ わが家の追加の持ち物</h2><div id="extras"></div><div class="extra"><input id="new-item" placeholder="追加する持ち物"><button id="add">追加</button></div></section><p class="hint">チェック状態はiPhoneごとに保存され、奥さまと共有はされません。「次回用にリセット」でチェックだけ解除し、追加項目は残します。乳児用など必要のない項目は未チェックのままでも使えます。</p></main><footer><div><button id="reset">↻ 次回用にリセット</button><button id="all">全部チェック ✓</button></div></footer><script>
const groups=[["📄 書類・証明書","医師連絡票","保護者からの病状連絡票","健康保険証・子どもの医療費受給資格証","母子健康手帳・おくすりノート"],["💊 お薬・食事・飲み物","薬・解熱剤など（医師から処方されているもの）","お弁当","おやつ（午前・午後）","飲み物（お茶・清涼飲料水など）","水筒・ジュース（手書きメモ）"],["🍼 乳児の場合","ミルク・哺乳瓶・離乳食など（乳児の場合のみ）"],["🧺 タオル・着替え・衛生用品","タオル 1枚","バスタオル 2枚（冬はバスタオル1枚・毛布1枚）","手・口拭きウェットティッシュ または おしぼり","食事用エプロン","着替え（パンツ・オムツを含む）","箱ティッシュ","おしり拭き","ビニール袋 3枚"]];const key="byoji-check-family-v1";let state={checked:{},extra:[]};try{const saved=JSON.parse(localStorage.getItem(key)||"null");if(saved&&saved.checked&&Array.isArray(saved.extra))state=saved}catch(e){}const safeId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){try{localStorage.setItem(key,JSON.stringify(state));document.getElementById("status").textContent="✓ このiPhoneに保存しました"}catch(e){document.getElementById("status").textContent="保存できません。Safariで開いてください"}}
function item(label,id,custom){const row=document.createElement("label");row.className="item";const input=document.createElement("input");input.type="checkbox";input.dataset.id=id;input.checked=!!state.checked[id];input.addEventListener("change",()=>{state.checked[id]=input.checked;save();progress()});const name=document.createElement("span");name.textContent=label;row.append(input,name);if(custom){const remove=document.createElement("button");remove.type="button";remove.className="remove";remove.textContent="×";remove.setAttribute("aria-label",label+"を削除");remove.onclick=e=>{e.preventDefault();if(confirm("この項目を削除しますか？")){state.extra=state.extra.filter(x=>x.id!==id);delete state.checked[id];save();render()}};row.append(remove)}return row}
function render(){const root=document.getElementById("checklist");root.replaceChildren();let n=0;groups.forEach(g=>{const section=document.createElement("section");const title=document.createElement("h2");title.textContent=g[0];section.append(title);g.slice(1).forEach(label=>section.append(item(label,"base-"+n++)));root.append(section)});const extras=document.getElementById("extras");extras.replaceChildren();state.extra.forEach(x=>extras.append(item(x.label,x.id,true)));progress()}
function progress(){const boxes=[...document.querySelectorAll('input[type="checkbox"][data-id]')];const done=boxes.filter(x=>x.checked).length;document.getElementById("count").textContent=done+" / "+boxes.length;document.getElementById("bar").style.width=(boxes.length?done/boxes.length*100:0)+"%"}
function add(){const el=document.getElementById("new-item");const label=el.value.trim();if(!label)return;state.extra.push({id:"extra-"+safeId(),label});el.value="";save();render()}
document.getElementById("add").onclick=add;document.getElementById("new-item").onkeydown=e=>{if(e.key==="Enter")add()};
document.getElementById("reset").onclick=()=>{if(confirm("チェックをすべて外して、次回用に戻しますか？")){state.checked={};save();render();scrollTo(0,0)}};
document.getElementById("all").onclick=()=>{if(confirm("すべてチェック済みにしますか？")){document.querySelectorAll('input[type="checkbox"][data-id]').forEach(x=>state.checked[x.dataset.id]=true);save();render()}};
render();save();</script></body></html>
