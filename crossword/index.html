function build(){let g=Array.from({length:9},()=>Array(9).fill("")),e=LAYOUTS[level].map(item=>({...item,cells:[...item.w].map((ch,i)=>[item.r+(item.d==="v"?i:0),item.c+(item.d==="h"?i:0),ch])}));e.forEach(a=>a.cells.forEach(([r,c,ch])=>g[r][c]=ch));board=g;let rr=e.flatMap(x=>x.cells.map(z=>z[0])),cc=e.flatMap(x=>x.cells.map(z=>z[1]));let rMin=Math.min(...rr),rMax=Math.max(...rr),cMin=Math.min(...cc),cMax=Math.max(...cc);let n=Math.min(11,Math.max(5,rMax-rMin+3,cMax-cMin+3));view={r:0,c:0,n:9};entries=e.sort((a,b)=>a.r-b.r||a.c-b.c||a.d.localeCompare(b.d));entries.forEach((x,i)=>x.id=i+1);saved=JSON.parse(localStorage.getItem("hiro_cross_v3_"+level)||"{}");focus=0;pos=0;boardRendered=false;draw()}
function save(){localStorage.setItem("hiro_cross_v3_"+level,JSON.stringify(saved));localStorage.setItem("hiro_cross_v3_level",level);localStorage.setItem("hiro_cross_v3_done",JSON.stringify(done))}
function cells(){return entries[focus].cells}function draw(){let b=$("board");if(!boardRendered){b.style.gridTemplateColumns="repeat("+view.n+",1fr)";b.innerHTML="";let current=cells(),keys=new Set(current.map(([r,c])=>r+","+c)),active=current[pos];let num=new Map(entries.map(x=>[x.r+","+x.c,x.id]));let total=0,filled=0;for(let r=view.r;r<view.r+view.n;r++)for(let c=view.c;c<view.c+view.n;c++){let key=r+","+c,div=document.createElement("button");div.className="cell"+(!board[r][c]?" black":keys.has(key)?" inword":"")+(r===active[0]&&c===active[1]?" focus":"");if(board[r][c]){total++;if(saved[key])filled++;div.textContent=saved[key]||"";if(num.has(key)){let s=document.createElement("span");s.className="number";s.textContent=num.get(key);div.appendChild(s)}div.onclick=()=>{let options=entries.map((x,i)=>({x,i})).filter(o=>o.x.cells.some(([y,z])=>y===r&&z===c));let isSame=active[0]===r&&active[1]===c;let old=options.findIndex(o=>o.i===focus);focus=options[isSame&&old>=0?(old+1)%options.length:0].i;pos=cells().findIndex(([y,z])=>y===r&&z===c);draw()}}else div.disabled=true;b.appendChild(div)}boardRendered=true;}else{let current=cells(),active=current[pos],keys=new Set(current.map(([r,c])=>r+","+c));b.querySelectorAll(".cell").forEach((div,i)=>{let r=view.r+Math.floor(i/view.n),c=view.c+i%view.n,key=r+","+c;if(!board[r][c])return;div.classList.toggle("inword",keys.has(key));div.classList.toggle("focus",r===active[0]&&c===active[1]);if(div.firstChild?.nodeType===3)div.firstChild.nodeValue=saved[key]||"";else div.insertBefore(document.createTextNode(saved[key]||""),div.firstChild);});}
let total=0,filled=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(board[r][c]){total++;if(saved[r+","+c])filled++;}
$("name").textContent=(level+1)+" / "+PACKS.length+" · "+PACKS[level].title;let a=entries[focus];$("ref").textContent=a.id+"番の"+(a.d==="h"?"ヨコ":"タテ")+" · "+[...a.w].length+"文字";$("clue").textContent=a.h;renderKana()} 
const KANA_COLUMNS=["アイウエオ","カキクケコ","サシスセソ","タチツテト","ナニヌネノ","ハヒフヘホ","マミムメモ","ヤ　ユ　ヨ","ラリルレロ","ワンー　ヲ"];
const KANA_EXTRA=["ガギグゲゴ","ザジズゼゾ","ダヂヅデド","バビブベボ","パピプペポ","ァィゥェォ","ャュョッー","ン　　　"];
let kanaMode="basic";
function renderKana(){let kb=$("keys");kb.innerHTML="";kb.dataset.mode=kanaMode;const columns=kanaMode==="basic"?KANA_COLUMNS:KANA_EXTRA;columns.forEach((col,i)=>{[...col].forEach((ch,j)=>{let button=document.createElement("button");button.textContent=ch==="　"?"":ch;button.disabled=ch==="　";button.style.gridColumn=String(i+1);button.style.gridRow=String(j+1);if(ch!=="　")button.onclick=()=>type(ch);kb.appendChild(button)})});$("kanaToggle").textContent=kanaMode==="basic"?"濁音・小文字":"基本の五十音"}

let checking=false;function type(ch){if(checking)return;let a=cells()[pos];const expected=board[a[0]][a[1]];const base={"ガ":"カ","ギ":"キ","グ":"ク","ゲ":"ケ","ゴ":"コ","ザ":"サ","ジ":"シ","ズ":"ス","ゼ":"セ","ゾ":"ソ","ダ":"タ","ヂ":"チ","ヅ":"ツ","デ":"テ","ド":"ト","バ":"ハ","ビ":"ヒ","ブ":"フ","ベ":"ヘ","ボ":"ホ","パ":"ハ","ピ":"ヒ","プ":"フ","ペ":"ヘ","ポ":"ホ"};if(base[expected]===ch)ch=expected;const small={"ァ":"ア","ィ":"イ","ゥ":"ウ","ェ":"エ","ォ":"オ","ャ":"ヤ","ュ":"ユ","ョ":"ヨ","ッ":"ツ"};if(small[expected]===ch)ch=expected;saved[a[0]+","+a[1]]=ch;if(pos<cells().length-1)pos++;$("message").textContent="";save();draw();autoCheck()}function move(delta){checking=false;$("wrongMark").classList.remove("show");level=(level+delta+PACKS.length)%PACKS.length;$("message").textContent="";build()}
function autoCheck(){if(checking)return;let total=0,filled=0,wrong=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(board[r][c]){total++;let value=saved[r+","+c];if(value)filled++;if(value!==board[r][c])wrong++}if(filled!==total)return;checking=true;if(wrong===0){done[level]=true;save();$("resultTitle").textContent="🎉 正解！";$("resultText").textContent="パズル "+(level+1)+" クリア！";$("modal").classList.add("show");checking=false}else{$("wrongMark").classList.add("show");setTimeout(()=>{$("wrongMark").classList.remove("show");saved={};save();pos=0;focus=0;draw();checking=false},850)}}
$("kanaToggle").onclick=()=>{kanaMode=kanaMode==="basic"?"extra":"basic";renderKana()};$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("close").onclick=()=>{$("modal").classList.remove("show");move(1)};document.addEventListener("keydown",ev=>{if(ev.key==="Backspace"){let a=cells()[pos];delete saved[a[0]+","+a[1]];save();draw()}else if(ev.key==="ArrowRight"||ev.key==="ArrowDown"){pos=(pos+1)%cells().length;draw()}else if(ev.key==="ArrowLeft"||ev.key==="ArrowUp"){pos=(pos+cells().length-1)%cells().length;draw()}});
build();
