<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#70c2d1"><title>ひろのクロスワード</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;background:linear-gradient(#9ddce0,#eaf7fa 45%,#f6faff);color:#26384c;min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 8px;font-weight:800}h1{font-size:20px;margin:0}.coin{background:white;border-radius:30px;padding:10px 15px;box-shadow:0 3px 12px #438b9630}main{max-width:580px;margin:auto;padding:8px 12px 30px}.top{display:flex;gap:8px;margin:10px 0;align-items:center}.top button,.actions button,.key button{border:0;cursor:pointer;font-family:inherit}.top button,.actions button{padding:12px;border-radius:14px;background:#fff;color:#247bd8;font-weight:700;box-shadow:0 2px 8px #528ba329}.top #level{flex:1;text-align:center;font-weight:800}#board{display:grid;background:#7d96ae;border:2px solid #7d96ae;gap:1px;width:100%;aspect-ratio:1/1;box-shadow:0 7px 18px #3a74952b}.cell{background:#f9fcff;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(15px,5.4vw,26px);font-weight:650;min-width:0;border:0;padding:0;color:#20334c}.cell.block{background:#cfe1f1}.cell.active{background:#ffe0a0}.cell.current{outline:3px solid #2789fc;outline-offset:-3px;z-index:1}.cell .num{position:absolute;top:1px;left:3px;font-size:10px;color:#60798d;font-weight:600}.clue{background:white;padding:14px;border-radius:16px;margin:14px 0;min-height:72px;box-shadow:0 2px 9px #5a99ae29}.clue small{color:#618399}.clue strong{display:block;font-size:18px;margin-top:5px}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.key button{background:#fff1d5;border:1px solid #e4c18d;box-shadow:0 3px 0 #cfac7a;border-radius:8px;min-height:53px;font-size:23px;font-weight:600;color:#2e3034}.key button:active{transform:translateY(2px)}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.actions button{flex:1;min-width:90px;font-size:14px}#msg{font-weight:800;text-align:center;min-height:26px;margin:14px}footer{text-align:center;color:#7b91a7;font-size:12px;padding:10px}button:focus-visible{outline:3px solid #176ff0}</style></head><body><header><h1>🧩 ひろのクロスワード</h1><div class="coin">⭐ <span id="points">0</span></div></header><main><div class="top"><button id="prev">◀ 前へ</button><div id="level"></div><button id="next">次へ ▶</button></div><div id="board" aria-label="クロスワード盤面"></div><div class="clue"><small id="meta">マスを押してね</small><strong id="hint">ヒントを選んでね</strong></div><div class="keys" id="keys"></div><div class="actions"><button id="direction">↔ タテ・ヨコ切替</button><button id="erase">⌫ 消す</button><button id="check">✓ 答え合わせ</button><button id="help">💡 1文字ヒント</button></div><div id="msg" role="status"></div><footer>無料・広告なし・データはこのiPhoneに保存されます</footer></main><script>
const packs=[
["はじめて","サクラ:春に花見をする木","タイヨウ:昼間に空を照らす星","トケイ:時間を知る道具","カメラ:写真を撮る道具","ラジオ:音声の放送を聞く機械"],
["たべもの","ラーメン:スープに入った麺料理","ミカン:冬にこたつで食べる果物","メロン:網目模様の果物","カレー:スパイスの効いた料理","レモン:すっぱい黄色の果物"],
["どうぶつ","キリン:首が長い動物","コアラ:ユーカリが好きな動物","クジラ:海にいる大きな哺乳類","ゴリラ:力持ちの類人猿","キツネ:しっぽがふさふさの動物"],
["おでかけ","デンシャ:線路を走る乗り物","ホテル:旅行中に泊まる場所","カバン:荷物を入れて持つ道具","チズ:場所を確認する紙やアプリ","タクシー:料金を払って乗る車"],
["しぜん","サクラ:春のピンク色の花","モミジ:秋に赤くなる葉","タイフウ:強い風と雨の気象現象","カミナリ:空が光り大きな音がする","キリ:朝によく出る白いもや"],
["くらし","ハブラシ:歯を磨く道具","マクラ:眠るとき頭を乗せる","トケイ:時刻を示す","カガミ:顔を映すもの","ツクエ:勉強や仕事で使う家具"],
["スポーツ","サッカー:足でボールを蹴る競技","テニス:ラケットを使う競技","スキー:雪の斜面を滑る競技","スモウ:土俵で力を競う競技","プール:水泳をする場所"],
["のりもの","クルマ:道路を走る四輪の乗り物","ヒコウキ:空を飛ぶ乗り物","デンシャ:線路を走る乗り物","フネ:水の上を進む乗り物","バス:たくさんの人が乗る車"],
["がっこう","センセイ:授業を教える人","エンピツ:文字を書く道具","コクバン:教室の前にある板","ツクエ:教科書を置く家具","テスト:学習の理解を確かめる問題"],
["まち","エキ:電車が止まる場所","コウエン:遊具や広場がある場所","ビョウイン:病気を診てもらう場所","ホンヤ:本を売っている店","スーパー:食料品を買う店"],
["きせつ","ハル:桜が咲く季節","ナツ:一年で暑い季節","アキ:紅葉の季節","フユ:雪が降る寒い季節","コタツ:寒い季節に温まる家具"],
["チャレンジ","シンブン:ニュースが載った紙","カレンダー:日付が書かれたもの","エレベーター:建物の階を上下する設備","レイゾウコ:食べ物を冷やす家電","パソコン:キーボードで操作する電子機器"]];
let level=+(localStorage.getItem("hiro-cross-level")||0),selected=0,selPos=0,done=JSON.parse(localStorage.getItem("hiro-cross-done")||"{}"),filled={},entries=[],grid=[],W=9,H=9,points=0;
function make(){let raw=packs[level].slice(1).map(x=>{let [word,clue]=x.split(":");return {word,clue}});W=11;H=11;grid=Array.from({length:H},()=>Array(W).fill(""));entries=[];for(let i=0;i<raw.length;i++){let item=raw[i],placed=false,candidates=[];for(let d of ["h","v"])for(let r=0;r<H;r++)for(let c=0;c<W;c++){let cells=[...item.word].map((ch,j)=>[r+(d==="v"?j:0),c+(d==="h"?j:0),ch]);if(cells.some(([y,x])=>y>=H||x>=W))continue;let clashes=0,bad=false;for(let [y,x,ch] of cells){if(grid[y][x]&&grid[y][x]!==ch){bad=true;break}if(grid[y][x]===ch)clashes++}if(bad)continue;let score=clashes*100-Math.abs(r-4)*2-Math.abs(c-4)*2;if(i===0)score=-Math.abs(r-4)*2-Math.abs(c-3)*2;else if(!clashes)score-=200;candidates.push({d,r,c,cells,score})}candidates.sort((a,b)=>b.score-a.score);let pick=candidates[0];if(pick){pick.cells.forEach(([y,x,ch])=>grid[y][x]=ch);entries.push({...item,...pick,id:i+1})}}
let k="hiro-cross-"+level;filled=JSON.parse(localStorage.getItem(k)||"{}");selected=0;selPos=0;render()}
function active(){return entries[selected]}function save(){localStorage.setItem("hiro-cross-"+level,JSON.stringify(filled));localStorage.setItem("hiro-cross-level",level);localStorage.setItem("hiro-cross-done",JSON.stringify(done))}
function render(){document.getElementById("level").textContent="パズル "+(level+1)+"/12 · "+packs[level][0];document.getElementById("points").textContent=Object.keys(done).length*100;let b=document.getElementById("board");b.style.gridTemplateColumns="repeat("+W+",1fr)";b.innerHTML="";let a=active(),akey=a.cells.map(([r,c])=>r+","+c),cur=a.cells[selPos];for(let r=0;r<H;r++)for(let c=0;c<W;c++){let div=document.createElement("button");div.className="cell"+(grid[r][c]?"":" block")+(akey.includes(r+","+c)?" active":"")+(cur&&cur[0]===r&&cur[1]===c?" current":"");let key=r+","+c;div.textContent=filled[key]||"";let start=entries.find(e=>e.r===r&&e.c===c);if(start){let small=document.createElement("span");small.className="num";small.textContent=start.id;div.appendChild(small)}if(grid[r][c])div.onclick=()=>{let opts=entries.map((e,i)=>({e,i})).filter(({e})=>e.cells.some(([y,x])=>y===r&&x===c));let found=opts.find(o=>o.i===selected);selected=found&&opts.length>1?opts[(opts.indexOf(found)+1)%opts.length].i:opts[0].i;selPos=active().cells.findIndex(([y,x])=>y===r&&x===c);render()};else div.disabled=true;b.appendChild(div)}document.getElementById("meta").textContent="問題 "+a.id+" · "+(a.d==="h"?"ヨコ":"タテ")+" · "+a.word.length+"文字";document.getElementById("hint").textContent=a.clue;const options=[...new Set([...a.word,...entries.flatMap(e=>[...e.word])])];let chars=[...a.word,...options].slice(0,22).sort(()=>0.5-Math.random());let keys=document.getElementById("keys");keys.innerHTML="";[...new Set(chars)].forEach(ch=>{let t=document.createElement("button");t.textContent=ch;t.onclick=()=>put(ch);keys.appendChild(t)});}
function put(ch){let a=active(),cell=a.cells[selPos];if(!cell)return;filled[cell[0]+","+cell[1]]=ch;if(selPos<a.cells.length-1)selPos++;save();render()}function change(n){level=(level+n+packs.length)%packs.length;document.getElementById("msg").textContent="";make()}
document.getElementById("prev").onclick=()=>change(-1);document.getElementById("next").onclick=()=>change(1);document.getElementById("erase").onclick=()=>{let [r,c]=active().cells[selPos];delete filled[r+","+c];if(selPos>0)selPos--;save();render()};document.getElementById("help").onclick=()=>put(active().word[selPos]);document.getElementById("direction").onclick=()=>{let cell=active().cells[selPos];let p=entries.findIndex((e,i)=>i!==selected&&e.cells.some(([r,c])=>r===cell[0]&&c===cell[1]));if(p>=0){selected=p;selPos=active().cells.findIndex(([r,c])=>r===cell[0]&&c===cell[1])}else selected=(selected+1)%entries.length,selPos=0;render()};document.getElementById("check").onclick=()=>{let mismatches=0,total=0;for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(grid[r][c]){total++;if(filled[r+","+c]!==grid[r][c])mismatches++}let m=document.getElementById("msg");if(!mismatches){done[level]=true;save();m.textContent="🎉 全問正解！100ポイント獲得！"}else m.textContent="あと "+mismatches+" マス！ （"+(total-mismatches)+"/"+total+"）"};document.addEventListener("keydown",e=>{if(e.key==="Backspace"){document.getElementById("erase").click();return}if(e.key==="ArrowRight"||e.key==="ArrowDown"){selPos=(selPos+1)%active().word.length;render()}if(e.key==="ArrowLeft"||e.key==="ArrowUp"){selPos=(selPos+active().word.length-1)%active().word.length;render()}});make();
</script></body></html>
