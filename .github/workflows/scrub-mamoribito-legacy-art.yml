name: Scrub Mamoribito Legacy Hero Art

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scrub-mamoribito-legacy-art.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove embedded legacy hero JPEG data
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("mamoribito/index.html")
          text = p.read_text(encoding="utf-8")

          plain = re.compile(r',"hero_[A-Za-z0-9_]+":"data:image/jpeg;base64,[A-Za-z0-9+/=]+"')
          escaped = re.compile(r',\\"hero_[A-Za-z0-9_]+\\":\\"data:image/jpeg;base64,[A-Za-z0-9+/=]+\\"')

          text, n1 = plain.subn("", text)
          text, n2 = escaped.subn("", text)

          advanced_key = re.compile(r',"advanced_jobs_v1":"data:image/webp;base64,[A-Za-z0-9+/=]+"')
          advanced_key_escaped = re.compile(r',\\\"advanced_jobs_v1\\\":\\\"data:image/webp;base64,[A-Za-z0-9+/=]+\\\"')
          sheet_b64 = re.compile(r"const sheetB64 = '[A-Za-z0-9+/=]+';")
          sheet_b64_escaped = re.compile(r"const sheetB64 = '[A-Za-z0-9+/=]+';")

          text, n3 = advanced_key.subn("", text)
          text, n4 = advanced_key_escaped.subn("", text)
          text, n5 = sheet_b64.subn("const sheetB64 = '';", text)
          text, n6 = sheet_b64_escaped.subn("const sheetB64 = '';", text)

          if plain.search(text) or escaped.search(text) or advanced_key.search(text) or advanced_key_escaped.search(text):
              raise SystemExit("legacy profession image data still present")

          if any((n1, n2, n3, n4, n5, n6)):
              p.write_text(text, encoding="utf-8")
          print(f"removed legacy blobs: hero_plain={n1}, hero_template={n2}, advanced={n3+n4}, inline_sheet={n5+n6}")

      - name: Commit scrubbed live build
        shell: bash
        run: |
          if git diff --quiet -- mamoribito/index.html; then
            echo "No legacy hero JPEG data found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mamoribito/index.html
          git commit -m "art: purge embedded legacy hero jpeg data"
          git push
