name: Unify all Misaki article imagery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/unify-misaki-articles.yml"

permissions:
  contents: write

jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unify article covers and branding
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("articles")
          for p in sorted(root.glob("*.html")):
              slug = p.stem
              s = p.read_text(encoding="utf-8")

              if slug == "monitor-arm":
                  local = "/assets/misaki-live/monitor-arm.png?v=20260927-final"
                  full = "https://hiroai02.github.io/assets/misaki-live/monitor-arm.png?v=20260927-final"
              else:
                  local = f"/assets/misaki-articles/{slug}.png?v=20260927-all"
                  full = f"https://hiroai02.github.io/assets/misaki-articles/{slug}.png?v=20260927-all"

              s = re.sub(r'(<meta property="og:image" content=")[^"]+(")', r'\1' + full + r'\2', s)
              s = re.sub(r'(<meta name="twitter:image" content=")[^"]+(")', r'\1' + full + r'\2', s)
              s = re.sub(r'(<div class="article-cover"><img src=")[^"]+(")', r'\1' + local + r'\2', s)

              s = s.replace("くらしの比較ノート", "みさきの暮らしノート")
              s = s.replace("KURASHI NO NOTE", "MISAKI NO KURASHI NOTE")

              s = re.sub(
                  r'(<span class="brand-avatar"><img src=")[^"]+(")',
                  r'\1/assets/misaki-live/profile.png?v=20260927-final\2',
                  s
              )
              s = re.sub(
                  r'(<div class="article-misaki"><img src=")[^"]+(")',
                  r'\1/assets/misaki-live/profile.png?v=20260927-final\2',
                  s
              )

              p.write_text(s, encoding="utf-8")

      - name: Verify every article
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          covers = []
          problems = []
          for p in sorted(Path("articles").glob("*.html")):
              slug = p.stem
              s = p.read_text(encoding="utf-8")
              m = re.search(r'<div class="article-cover"><img src="([^"]+)"', s)
              cover = m.group(1) if m else ""
              covers.append((slug, cover))

              expected = (
                  "/assets/misaki-live/monitor-arm.png?v=20260927-final"
                  if slug == "monitor-arm"
                  else f"/assets/misaki-articles/{slug}.png?v=20260927-all"
              )
              if cover != expected:
                  problems.append(f"{slug}: cover mismatch: {cover}")
              if "くらしの比較ノート" in s:
                  problems.append(f"{slug}: old brand remains")
              if "misaki-soft-hero.webp" in s or "/assets/generated/" in s:
                  problems.append(f"{slug}: old image ref remains")
              if slug != "monitor-arm" and not Path(f"assets/misaki-articles/{slug}.png").exists():
                  problems.append(f"{slug}: dedicated image missing")

          vals = [c for _, c in covers]
          if len(vals) != len(set(vals)):
              problems.append("duplicate article cover refs remain")

          print("ARTICLE_COVERS")
          for row in covers:
              print(row)
          if problems:
              print("PROBLEMS")
              for x in problems:
                  print(x)
              sys.exit(1)

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/unify-misaki-articles.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify all Misaki article imagery and branding"
          git pull --rebase origin main
          git push
