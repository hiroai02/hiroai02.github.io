name: Replace Misaki category images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/replace-misaki-categories.yml"

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace category images with distinct generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/misaki-live
          curl -L --fail --retry 3 "https://d8j0ntlcm91z4.cloudfront.net/user_3JdRDeJ27LVw95AAi2eJvn4HzKx/hf_20260927_140501_036e8a36-3cd7-4ed8-9509-d85fddaff1d2.png" -o assets/misaki-live/kitchen.png
          curl -L --fail --retry 3 "https://d8j0ntlcm91z4.cloudfront.net/user_3JdRDeJ27LVw95AAi2eJvn4HzKx/hf_20260927_140501_aa51382f-434c-4d41-bf4d-100abfc68e75.png" -o assets/misaki-live/storage.png
          curl -L --fail --retry 3 "https://d8j0ntlcm91z4.cloudfront.net/user_3JdRDeJ27LVw95AAi2eJvn4HzKx/hf_20260927_140501_36348b33-439a-4f42-915a-b3b6d84a3750.png" -o assets/misaki-live/desk.png

          test -s assets/misaki-live/kitchen.png
          test -s assets/misaki-live/storage.png
          test -s assets/misaki-live/desk.png

          K=$(sha256sum assets/misaki-live/kitchen.png | cut -d' ' -f1)
          S=$(sha256sum assets/misaki-live/storage.png | cut -d' ' -f1)
          D=$(sha256sum assets/misaki-live/desk.png | cut -d' ' -f1)
          test "$K" != "$S"
          test "$K" != "$D"
          test "$S" != "$D"

      - name: Bust only category image cache
        shell: python
        run: |
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          import re
          s=re.sub(r'/assets/misaki-live/kitchen\.png\?v=[^"\']+', '/assets/misaki-live/kitchen.png?v=20260927-distinct3', s)
          s=re.sub(r'/assets/misaki-live/storage\.png\?v=[^"\']+', '/assets/misaki-live/storage.png?v=20260927-distinct3', s)
          s=re.sub(r'/assets/misaki-live/desk\.png\?v=[^"\']+', '/assets/misaki-live/desk.png?v=20260927-distinct3', s)
          p.write_text(s, encoding="utf-8")

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/replace-misaki-categories.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace kitchen storage and desk with distinct generated images"
          git push
