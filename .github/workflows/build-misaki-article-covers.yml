name: Build distinct Misaki article covers

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-misaki-article-covers.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          python -m pip install --quiet pillow requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build unique article covers and update pages
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import requests, io, re, os

          OUT=Path("assets/misaki-articles")
          OUT.mkdir(parents=True, exist_ok=True)

          articles = {
            "amido-net": {
              "label":"網戸ネット",
              "sub":"メッシュ数・虫除け・目隠し",
              "url":"https://m.media-amazon.com/images/I/61e4jz6orkL._AC_SL1200_.jpg",
              "accent":(224,132,138),"bg":(252,236,235)
            },
            "amido-roller": {
              "label":"網戸の戸車",
              "sub":"径・メーカー・交換",
              "url":"https://m.media-amazon.com/images/I/817GpWoDIWL._AC_SL1200_.jpg",
              "accent":(109,157,184),"bg":(232,243,249)
            },
            "cresent-lock": {
              "label":"クレセント錠",
              "sub":"窓の鍵・型番・交換",
              "url":"https://m.media-amazon.com/images/I/31oPfIIakRL._AC_SL1200_.jpg",
              "accent":(150,124,173),"bg":(242,236,247)
            },
            "drain-hose": {
              "label":"ドレンホース",
              "sub":"14mm・16mm・水漏れ対策",
              "url":"https://m.media-amazon.com/images/I/61Q0TZphTlL._AC_SL1200_.jpg",
              "accent":(88,155,181),"bg":(228,243,247)
            },
            "fumidai": {
              "label":"洗面所の踏み台",
              "sub":"高さ・子ども・高所収納",
              "url":"https://m.media-amazon.com/images/I/718cqNzE20L._AC_SL1200_.jpg",
              "accent":(218,151,107),"bg":(250,239,228)
            },
            "jaguchi-adapter": {
              "label":"蛇口アダプター",
              "sub":"ネジ規格・延長ホース",
              "url":"https://m.media-amazon.com/images/I/71UfqNthojL._AC_SL1200_.jpg",
              "accent":(94,158,159),"bg":(229,244,242)
            },
            "kankisen-filter": {
              "label":"換気扇フィルター",
              "sub":"深型・浅型・薄型",
              "url":"https://m.media-amazon.com/images/I/81vytZ7k1ML._AC_SL1200_.jpg",
              "accent":(222,129,124),"bg":(253,235,232)
            },
            "seion-keyboard": {
              "label":"静音キーボード",
              "sub":"在宅ワーク・接続・キーサイズ",
              "url":"https://m.media-amazon.com/images/I/61t1h-+MvfL._AC_SL1200_.jpg",
              "accent":(92,132,181),"bg":(232,239,249)
            },
            "shinsui-taisaku": {
              "label":"浸水対策",
              "sub":"玄関・止水板・水害対策",
              "url":"https://m.media-amazon.com/images/I/51SNG+X+kVL._AC_SL1200_.jpg",
              "accent":(72,137,172),"bg":(227,239,246)
            },
            "shoes-rack": {
              "label":"シューズラック",
              "sub":"段数・高さ・収納足数",
              "url":"https://m.media-amazon.com/images/I/81ysx4fEPIL._AC_SL1200_.jpg",
              "accent":(167,137,93),"bg":(247,240,228)
            },
            "sukima-shuno-rack": {
              "label":"すきま収納",
              "sub":"幅・測り方・ラック選び",
              "url":"https://m.media-amazon.com/images/I/61PdFWi-nLL._AC_SL1200_.jpg",
              "accent":(111,150,91),"bg":(235,244,228)
            },
            "sunoko-bed": {
              "label":"すのこベッド",
              "sub":"耐荷重・折りたたみ・湿気対策",
              "url":"https://m.media-amazon.com/images/I/71pRfqXHPyL._AC_SL1200_.jpg",
              "accent":(170,124,105),"bg":(246,235,230)
            },
            "tsuppari-curtain-rail": {
              "label":"突っ張りカーテン",
              "sub":"窓幅・賃貸・穴あけ不要",
              "url":"https://m.media-amazon.com/images/I/41M33gLLkXL._AC_SL1200_.jpg",
              "accent":(181,120,154),"bg":(249,232,241)
            },
            "tsupparidana": {
              "label":"突っ張り棚",
              "sub":"天井高・賃貸・収納",
              "url":"https://m.media-amazon.com/images/I/61Su8dVCpaL._AC_SL1200_.jpg",
              "accent":(122,151,89),"bg":(237,244,228)
            },
          }

          guide_sources=[
            "https://m.media-amazon.com/images/I/71UfqNthojL._AC_SL1200_.jpg",
            "https://m.media-amazon.com/images/I/81vytZ7k1ML._AC_SL1200_.jpg",
            "https://m.media-amazon.com/images/I/61Q0TZphTlL._AC_SL1200_.jpg",
            "https://m.media-amazon.com/images/I/51SNG+X+kVL._AC_SL1200_.jpg",
          ]

          font_candidates=[
            "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc",
            "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc",
          ]
          bold=next((p for p in font_candidates if Path(p).exists()),None)
          reg="/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          F56=ImageFont.truetype(bold,56)
          F31=ImageFont.truetype(reg,31)
          F23=ImageFont.truetype(reg,23)

          def fetch(url):
            r=requests.get(url,timeout=30,headers={"User-Agent":"Mozilla/5.0"})
            r.raise_for_status()
            return Image.open(io.BytesIO(r.content)).convert("RGB")

          def contain(im, box):
            w,h=box
            im.thumbnail((w,h),Image.Resampling.LANCZOS)
            return im

          def cover_card(label, sub, url, accent, bg):
            W,H=1200,675
            base=Image.new("RGB",(W,H),bg)
            d=ImageDraw.Draw(base)
            d.ellipse((760,-190,1260,310),fill=tuple(min(255,c+18) for c in bg))
            d.ellipse((-130,500,260,890),fill=tuple(min(255,c+10) for c in bg))

            panel=Image.new("RGBA",(610,555),(255,255,255,235))
            panel=panel.filter(ImageFilter.GaussianBlur(0.3))
            base.paste(panel,(55,60),panel)

            im=fetch(url)
            im=contain(im,(530,475))
            x=95+(500-im.width)//2
            y=100+(430-im.height)//2
            base.paste(im,(x,y))

            d.rounded_rectangle((705,105,1125,180),radius=38,fill=accent)
            d.text((740,120),"MISAKI NOTE",font=F23,fill="white")
            d.text((705,230),label,font=F56,fill=(74,57,52))
            d.multiline_text((710,315),sub,font=F31,fill=(105,82,74),spacing=12)
            d.rounded_rectangle((705,480,1090,545),radius=30,fill=(255,255,255))
            d.text((750,496),"暮らしをもっと心地よく",font=F23,fill=accent)
            return base

          for slug,a in articles.items():
            im=cover_card(a["label"],a["sub"],a["url"],a["accent"],a["bg"])
            im.save(OUT/f"{slug}.png",quality=95,optimize=True)

          # Guide: four clearly different subjects in one image.
          W,H=1200,675
          bg=(244,239,233)
          guide=Image.new("RGB",(W,H),bg)
          d=ImageDraw.Draw(guide)
          tiles=[]
          for u in guide_sources:
            im=fetch(u)
            im=contain(im,(245,245))
            tile=Image.new("RGB",(260,260),"white")
            tile.paste(im,((260-im.width)//2,(260-im.height)//2))
            tiles.append(tile)
          positions=[(55,60),(330,60),(55,335),(330,335)]
          for tile,pos in zip(tiles,positions):
            guide.paste(tile,pos)
          d.rounded_rectangle((650,105,1115,180),radius=38,fill=(211,126,120))
          d.text((690,120),"MISAKI NOTE",font=F23,fill="white")
          d.text((650,235),"水まわり・防災",font=F56,fill=(74,57,52))
          d.multiline_text((655,325),"サイズ・規格を\nまとめて確認",font=F31,fill=(105,82,74),spacing=15)
          d.rounded_rectangle((650,500,1085,565),radius=30,fill="white")
          d.text((700,516),"4つの失敗しやすいポイント",font=F23,fill=(180,99,96))
          guide.save(OUT/"mizumawari-guide.png",quality=95,optimize=True)

          slugs=list(articles)+["mizumawari-guide"]
          for slug in slugs:
            p=Path("articles")/f"{slug}.html"
            s=p.read_text(encoding="utf-8")
            rel=f"/assets/misaki-articles/{slug}.png?v=20260927-all"
            absu=f"https://hiroai02.github.io/assets/misaki-articles/{slug}.png?v=20260927-all"

            # OG / Twitter
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(">)',lambda m:m.group(1)+absu+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(">)',lambda m:m.group(1)+absu+m.group(2),s)

            # Article cover, including old SVG/current shared image/data URI.
            s=re.sub(r'(<div class="article-cover"><img src=")[^"]+(")',lambda m:m.group(1)+rel+m.group(2),s)

            # Replace all old shared Misaki/stock avatar imagery with current profile.
            s=s.replace('/assets/misaki-soft-hero.webp','/assets/misaki-live/profile.png?v=20260927-final')
            s=re.sub(r'https://images\.unsplash\.com/photo-1738676524296-364cf18900a8\?[^"]+','/assets/misaki-live/profile.png?v=20260927-final',s)

            p.write_text(s,encoding="utf-8")

          # Keep monitor-arm's approved dedicated image, but normalize any legacy profile refs if present.
          mp=Path("articles/monitor-arm.html")
          ms=mp.read_text(encoding="utf-8")
          ms=ms.replace('/assets/misaki-soft-hero.webp','/assets/misaki-live/profile.png?v=20260927-final')
          mp.write_text(ms,encoding="utf-8")

          # Delete obsolete shared/placeholder files if present.
          for old in [
            Path("assets/misaki-soft-hero.webp"),
            Path("assets/generated"),
          ]:
            if old.is_file():
              old.unlink()
            elif old.is_dir():
              import shutil
              shutil.rmtree(old)

      - name: Verify uniqueness and no old refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/misaki-articles -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 15
          [ "$(sha256sum assets/misaki-articles/*.png | awk '{print $1}' | sort -u | wc -l)" -eq 15 ]
          ! grep -R "/assets/generated/" articles
          ! grep -R "misaki-soft-hero.webp" articles
          ! grep -R "photo-1738676524296-364cf18900a8" articles
          grep -R "/assets/misaki-articles/amido-net.png" articles/amido-net.html
          grep -R "/assets/misaki-articles/tsupparidana.png" articles/tsupparidana.html

      - name: Commit generated covers
        shell: bash
        run: |
          rm -f .github/workflows/build-misaki-article-covers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Give every Misaki article a distinct cover image"
          git push
