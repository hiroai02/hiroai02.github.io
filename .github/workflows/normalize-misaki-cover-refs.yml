name: Normalize Misaki article cover refs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-misaki-cover-refs.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point every article to its own local cover
        shell: python
        run: |
          from pathlib import Path
          import re

          slugs = [
            "amido-net","amido-roller","cresent-lock","drain-hose","fumidai",
            "jaguchi-adapter","kankisen-filter","mizumawari-guide","seion-keyboard",
            "shinsui-taisaku","shoes-rack","sukima-shuno-rack","sunoko-bed",
            "tsuppari-curtain-rail","tsupparidana"
          ]

          for slug in slugs:
            p=Path("articles")/f"{slug}.html"
            s=p.read_text(encoding="utf-8")
            rel=f"/assets/misaki-articles/{slug}.png?v=20260927-all2"
            absu=f"https://hiroai02.github.io/assets/misaki-articles/{slug}.png?v=20260927-all2"
            s=re.sub(r'(<meta property="og:image" content=")[^"]+(">)',lambda m:m.group(1)+absu+m.group(2),s)
            s=re.sub(r'(<meta name="twitter:image" content=")[^"]+(">)',lambda m:m.group(1)+absu+m.group(2),s)
            s=re.sub(r'(<div class="article-cover"><img src=")[^"]+(")',lambda m:m.group(1)+rel+m.group(2),s)
            s=s.replace('/assets/misaki-soft-hero.webp','/assets/misaki-live/profile.png?v=20260927-final')
            s=re.sub(r'https://images\.unsplash\.com/photo-1738676524296-364cf18900a8\?[^"]+','/assets/misaki-live/profile.png?v=20260927-final',s)
            p.write_text(s,encoding="utf-8")

      - name: Verify all local article covers
        shell: bash
        run: |
          set -euo pipefail
          for f in articles/*.html; do
            if [ "$(basename "$f")" = "monitor-arm.html" ]; then continue; fi
            grep -q '/assets/misaki-articles/' "$f"
          done
          ! grep -R 'class="article-cover"><img src="https://m.media-amazon.com' articles
          ! grep -R '/assets/generated/' articles
          ! grep -R 'misaki-soft-hero.webp' articles

      - name: Commit normalization
        shell: bash
        run: |
          rm -f .github/workflows/normalize-misaki-cover-refs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use dedicated local cover for every Misaki article"
          git push
